[project]
name = "ragamuffin"
version = "0.9.2"
description = "A CLI tool that indexes documents into SQLite with sqlite-vec for semantic search using local embeddings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastembed",
    "sqlite-vec",
    "click",
    "pyyaml",
    "rich",
    "mcp",
    "flask",
    "pygments",
]

[project.scripts]
muffin = "ragamuffin.cli:cli"
mf = "ragamuffin.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragamuffin"]
